<script>
const V = [{"num": "V1", "name": "Screen Projection", "desc": "The lobby screen's Resource Wall, projected as-is onto the wall. Floors show a few glowing icons. Only people who opted in appear.", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Berkeley Looks Out · V1 Screen Projection<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--blue:#002676;--deep:#001a52;--line:#3a5da8;--gold:#FDB515;--paper:#FAF6EC;--ink:#0b1b3f;--on2:#C9D3EA;--glow:#FDB515}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#000;font-family:Inter,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;color:var(--paper);overflow:hidden}\n  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}\n  #c:active{cursor:grabbing}\n  .card{position:fixed;left:20px;top:20px;max-width:380px;background:rgba(0,38,118,.94);border:2px solid var(--line);border-radius:0;padding:16px 18px;box-shadow:0 6px 18px rgba(0,13,51,.25);backdrop-filter:blur(6px)}\n  .eyebrow{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.3em;color:var(--glow);margin:0 0 8px}\n  h1{font-family:'Pixelify Sans',sans-serif;font-size:21px;line-height:27px;margin:0 0 6px;font-weight:600;text-shadow:none}\n  .card p{font-size:13px;line-height:19px;color:var(--on2);margin:0}\n  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:calc(100% - 24px);background:rgba(0,38,118,.94);padding:10px;border:2px solid var(--line);backdrop-filter:blur(6px)}\n  .group{display:flex;gap:6px;align-items:center}\n  .sep{width:1px;height:28px;background:rgba(201,211,234,.35);margin:0 4px}\n  button{font:400 12px/1 Silkscreen,monospace;letter-spacing:.14em;color:var(--paper);background:transparent;border:2px solid rgba(201,211,234,.45);border-radius:0;padding:10px 12px;min-height:40px;cursor:pointer;white-space:nowrap}\n  button:hover{background:rgba(255,255,255,.16)}\n  button[aria-pressed=\"true\"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n  button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}\n  button.primary:hover{background:#ffc94d}\n  .hint{position:fixed;right:20px;top:20px;font-size:12px;line-height:18px;color:var(--on2);background:rgba(0,26,82,.85);padding:8px 12px;border-radius:10px;text-align:right}\n  .note{position:fixed;right:20px;top:72px;max-width:260px;font-size:12px;line-height:18px;color:var(--ink);background:var(--gold);padding:8px 12px;display:none}\n  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--on2);background:var(--deep)}\n  @media (max-width:640px){.card{max-width:calc(100% - 40px)}.hint{display:none}.note{top:auto;bottom:150px;right:12px}}\n<\/style>\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\"}}\n<\/script>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Walkable 3D interior with projections\"><\/canvas>\n<div id=\"loading\">Loading…<\/div>\n\n<div class=\"card\">\n  <div class=\"eyebrow\">BERKELEY LOOKS OUT<\/div>\n  <h1>V1 · Screen Projection<\/h1>\n  <p>The lobby screen's Resource Wall, projected as-is onto the wall. Floors show a few glowing icons. Only people who opted in appear.<\/p>\n<\/div>\n\n<div class=\"hint\">Drag to look · WASD / arrows to walk<\/div>\n<div class=\"note\" id=\"note\">Daylight washes out projections. In airport tests, floor projections went almost unnoticed by day.<\/div>\n\n<div class=\"bar\" role=\"toolbar\" aria-label=\"Simulation controls\">\n  <div class=\"group\" role=\"group\" aria-label=\"Views\">\n    <button data-view=\"entry\" aria-pressed=\"true\">ENTRANCE<\/button>\n    <button data-view=\"near\">WALL<\/button>\n    <button data-view=\"screen\">SCREEN<\/button>\n    <button data-view=\"floor\">FLOOR<\/button>\n    <button data-view=\"hall\">CORRIDOR<\/button>\n    <button data-view=\"over\">OVERVIEW<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <div class=\"group\" role=\"group\" aria-label=\"Lighting\">\n    <button id=\"dayBtn\" aria-pressed=\"false\">DAY<\/button>\n    <button id=\"eveBtn\" aria-pressed=\"true\">NIGHT<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <button id=\"joinBtn\" class=\"primary\">SOMEONE JOINS<\/button>\n<\/div>\n\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;\n\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color('#0b0f18');\nconst camera = new THREE.PerspectiveCamera(62, 1, 0.05, 80);\n\n// ---------- room: 14m x 10m x 4.5m ----------\nconst W = 14, D = 10, H = 4.5;\nconst xMin = -W/2, xMax = W/2, zMin = -D/2, zMax = D/2;\n\nfunction canvasTex(w, h, draw, repeat){\n  const c = document.createElement('canvas'); c.width = w; c.height = h;\n  draw(c.getContext('2d'), w, h);\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  t.anisotropy = 8;\n  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }\n  return t;\n}\nfunction rand(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }\n\n// polished concrete\nconst concreteTex = canvasTex(512, 512, (g, w, h) => {\n  g.fillStyle = '#8b8e90'; g.fillRect(0,0,w,h);\n  const r = rand(7);\n  for (let i=0;i<9000;i++){ const v = 110 + r()*60; g.fillStyle = `rgba(${v},${v+2},${v+4},${0.08+r()*0.1})`; g.fillRect(r()*w, r()*h, 1+r()*3, 1+r()*3); }\n  g.strokeStyle = 'rgba(60,62,66,.35)'; g.lineWidth = 2; g.strokeRect(0,0,w,h);\n}, [6, 4]);\nconst floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: concreteTex, roughness: .32, metalness: .08}));\nfloor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);\n\n// perforated plywood (Jacobs foyer signature)\nfunction plywoodTex(seed, clusters){\n  return canvasTex(1024, 1024, (g, w, h) => {\n    g.fillStyle = '#e8d9bd'; g.fillRect(0,0,w,h);\n    const r = rand(seed);\n    for (let i=0;i<40;i++){ g.fillStyle = `rgba(190,160,115,${0.05+r()*0.06})`; g.fillRect(0, r()*h, w, 2+r()*10); }\n    g.strokeStyle = 'rgba(150,120,80,.5)'; g.lineWidth = 3;\n    for (let x=0;x<=w;x+=256) { g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }\n    g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();\n    const sp = 22;\n    for (let y=sp/2;y<h;y+=sp) for (let x=sp/2;x<w;x+=sp){\n      let wgt = 0;\n      for (const [cx,cy,rr] of clusters){ const d = Math.hypot(x-cx, y-cy); wgt = Math.max(wgt, 1 - d/rr); }\n      if (wgt <= 0 || r() > wgt*1.6) continue;\n      g.fillStyle = '#d4682b'; g.beginPath(); g.arc(x, y, 3 + wgt*5, 0, Math.PI*2); g.fill();\n    }\n  });\n}\nconst wallPly = plywoodTex(11, [[260,300,260],[620,240,220],[520,700,280],[900,620,200]]);\nconst ceilPly = plywoodTex(23, [[200,200,500],[800,700,500],[500,500,300]]);\nceilPly.wrapS = ceilPly.wrapT = THREE.RepeatWrapping; ceilPly.repeat.set(3,2);\n\nconst white = new THREE.MeshStandardMaterial({color:'#e9ecee', roughness:.9});\nconst teal = new THREE.MeshStandardMaterial({color:'#8fb2b4', roughness:.85});\nfunction wall(w, h, mat, pos, rotY){\n  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);\n  m.position.set(...pos); m.rotation.y = rotY; m.receiveShadow = true; scene.add(m); return m;\n}\n// corridor opening on the right of the back wall\nconst CX0 = 4.8, CX1 = 7.0, CZ1 = zMin - 12, CH = 3.0, CXM = (CX0 + CX1)/2;\nwall(CX0 - xMin, H, white, [(xMin + CX0)/2, H/2, zMin], 0);                // back wall: projection surface\nwall(CX1 - CX0, H - CH, white, [CXM, (H + CH)/2, zMin], 0);                  // lintel over corridor\nwall(D, H, new THREE.MeshStandardMaterial({map: wallPly, roughness:.8}), [xMin, H/2, 0], Math.PI/2); // plywood wall\nwall(W, H, teal, [0, H/2, zMax], Math.PI);                                // front wall\nconst ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: ceilPly, roughness:.9}));\nceil.rotation.x = Math.PI/2; ceil.position.y = H; scene.add(ceil);\n\n// orange trim (like the foyer)\nconst orange = new THREE.MeshStandardMaterial({color:'#e2662a', roughness:.6});\nconst trim = new THREE.Mesh(new THREE.BoxGeometry(.08, .14, D), orange); trim.position.set(xMin+.04, H-.07, 0); scene.add(trim);\n\n// window wall (right)\nconst paneMat = new THREE.MeshBasicMaterial({color:'#cfe3f1'});\nconst frameMat = new THREE.MeshStandardMaterial({color:'#5d6570', roughness:.5, metalness:.4});\nwall(D, H, new THREE.MeshStandardMaterial({color:'#5d6570'}), [xMax+.02, H/2, 0], -Math.PI/2);\nfor (let i=0;i<5;i++){\n  const pz = zMin + 1 + i*2;\n  const pane = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 3.6), paneMat);\n  pane.position.set(xMax-.01, 2.1, pz); pane.rotation.y = -Math.PI/2; scene.add(pane);\n}\nfor (let i=0;i<=5;i++){ const f = new THREE.Mesh(new THREE.BoxGeometry(.1, H, .12), frameMat); f.position.set(xMax-.05, H/2, zMin + i*2); scene.add(f); }\nconst sill = new THREE.Mesh(new THREE.BoxGeometry(.1,.1,D), frameMat); sill.position.set(xMax-.05, .28, 0); scene.add(sill);\n\n// doorway in back wall\n\n\n// furniture: workbenches + stools + bench\nconst wood = new THREE.MeshStandardMaterial({color:'#d8b98c', roughness:.6});\nconst steel = new THREE.MeshStandardMaterial({color:'#e7e9ec', roughness:.4, metalness:.3});\nfunction box(w,h,d,mat,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; }\nfunction bench(x,z,rot=0){\n  const g = new THREE.Group();\n  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2,.08,.9), wood); top.position.y = .92; top.castShadow = true; g.add(top);\n  for (const [lx,lz] of [[-1,-.38],[1,-.38],[-1,.38],[1,.38]]){ const l = new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.06), steel); l.position.set(lx,.45,lz); l.castShadow = true; g.add(l); }\n  const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.1,.03,.8), steel); shelf.position.y = .25; g.add(shelf);\n  g.position.set(x,0,z); g.rotation.y = rot; scene.add(g);\n}\nbench(3.6, -.6); bench(3.6, 2.2);\nfunction stool(x,z){ const s = new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.05,20), new THREE.MeshStandardMaterial({color:'#7c8188'})); s.position.set(x,.68,z); s.castShadow = true; scene.add(s); const l = new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,.66,8), steel); l.position.set(x,.33,z); scene.add(l); }\nstool(2.7,.2); stool(4.5,.2); stool(3.2,3.0);\nbox(2.4,.08,.55, wood, -5.9, .46, 2.6); box(.08,.42,.4, steel, -6.9, .21, 2.6); box(.08,.42,.4, steel, -4.9, .21, 2.6);\n\n// people (scale + they catch the projection beam)\nfunction person(x,z,color,ry=0){\n  const g = new THREE.Group();\n  const mat = new THREE.MeshStandardMaterial({color, roughness:.8});\n  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.85,12), new THREE.MeshStandardMaterial({color:'#2b3446'})); legs.position.y = .43; g.add(legs);\n  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,.45,6,12), mat); body.position.y = 1.18; g.add(body);\n  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16), new THREE.MeshStandardMaterial({color:'#c99f7e'})); head.position.y = 1.62; g.add(head);\n  g.traverse(o => { if (o.isMesh) o.castShadow = true; });\n  g.position.set(x,0,z); g.rotation.y = ry; scene.add(g);\n}\nperson(3.1, .45, '#3f7e6c'); person(4.6, 2.9, '#c9a227', Math.PI); person(-1.2, -2.4, '#7a8fb8', .3);\n\n// ---------- lighting ----------\nconst hemi = new THREE.HemisphereLight('#dfe8f5', '#3a3530', .3);\nscene.add(hemi);\nconst sun = new THREE.DirectionalLight('#fff4e0', .3);\nsun.position.set(14, 7, 2); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);\nObject.assign(sun.shadow.camera, {left:-9,right:9,top:6,bottom:-6,near:1,far:40});\nscene.add(sun);\nconst downs = [];\nfor (const [x,z] of [[-4,-2],[0,-2],[4,-2],[-4,2.5],[0,2.5],[4,2.5]]){\n  const p = new THREE.PointLight('#ffd9a8', 2.2, 7, 2); p.position.set(x, H-.15, z); scene.add(p); downs.push(p);\n  const can = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.12,16), new THREE.MeshBasicMaterial({color:'#fff3df'})); can.position.set(x, H-.06, z); scene.add(can);\n}\n\n// ---------- the team's \"Pixel Go\" Resource Wall (night mode), drawn once and used on\n// the entrance screen, the wall projection and the floor projection ----------\nconst I = {\n  kit:[\"....####....\",\"....#..#....\",\"############\",\"#..........#\",\"#....##....#\",\"#....##....#\",\"#..######..#\",\"#..######..#\",\"#....##....#\",\"#....##....#\",\"#..........#\",\"############\"],\n  helmet:[\".....####.....\",\"...##.##.##...\",\"..#...##...#..\",\".#....##....#.\",\".#....##....#.\",\"#.....##.....#\",\"##############\",\"#............#\",\".############.\"],\n  bike:[\"..........###...\",\"...###.....#....\",\"....#.....#.....\",\"....######......\",\"...#.#...#.#....\",\".###..#.#..###..\",\"#...#..#..#...#.\",\"#..#.#...#.#..#.\",\"#...#.....#...#.\",\".###.......###..\"],\n  pot:[\"..#..#..#...\",\"...#..#..#..\",\"............\",\"...######...\",\".##########.\",\"#.#......#.#\",\"..#......#..\",\"..#......#..\",\"..#......#..\",\"...######...\"],\n  plant:[\".......###.\",\".....##..#.\",\"..##.#..#..\",\".#.. Z); scene.add(projHall);\nconst pC = projector(new THREE.Vector3(CXM, 2.85, CPZ + 1.6), new THREE.Vector3(CXM, 0, CPZ), 2.0, 1.125);\npC.spill.intensity = .8;\n// someone walking up and down the corridor\nconst walker = new THREE.Group();\n{\n  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.85,12), new THREE.MeshStandardMaterial({color:'#2b3446'})); legs.position.y = .43; walker.add(legs);\n  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,.45,6,12), new THREE.MeshStandardMaterial({color:'#5b8fd6', roughness:.8})); body.position.y = 1.18; walker.add(body);\n  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16), new THREE.MeshStandardMaterial({color:'#b8876a'})); head.position.y = 1.62; walker.add(head);\n  const bag = new THREE.Mesh(new THREE.BoxGeometry(.3,.38,.16), new THREE.MeshStandardMaterial({color:'#2f6f5e'})); bag.position.set(0, 1.2, .2); walker.add(bag);\n  walker.traverse(o => o.isMesh && (o.castShadow = true));\n  walker.position.set(CXM - .35, 0, CZ1 + 1); scene.add(walker);\n}\nlet hallGlow = 0;\n\n// ---------- lighting modes ----------\nlet mode = 'evening';\nfunction setMode(m){\n  mode = m;\n  document.getElementById('dayBtn').setAttribute('aria-pressed', m==='day');\n  document.getElementById('eveBtn').setAttribute('aria-pressed', m==='evening');\n  document.getElementById('note').style.display = m==='day' ? 'block' : 'none';\n  if (m === 'day'){\n    hemi.intensity = 1.6; sun.intensity = 3.2; paneMat.color.set('#d9ecf8'); scene.background.set('#cfe3f1');\n    downs.forEach(p => p.intensity = .6); renderer.toneMappingExposure = 1.05;\n    projWall.material.opacity = .55; projFloor.material.opacity = .45;\n    [pA, pB].forEach(p => { p.beam.material.opacity = .012; });\n  } else {\n    hemi.intensity = .28; sun.intensity = .25; paneMat.color.set('#1f2c47'); scene.background.set('#0b0f18');\n    downs.forEach(p => p.intensity = 2.2); renderer.toneMappingExposure = 1.0;\n    projWall.material.opacity = 1; projFloor.material.opacity = 1;\n    [pA, pB].forEach(p => { p.beam.material.opacity = .035; });\n  }\n}\ndocument.getElementById('dayBtn').onclick = () => setMode('day');\ndocument.getElementById('eveBtn').onclick = () => setMode('evening');\n\n// someone joins\nlet clock0 = performance.now();\nconst now = () => (performance.now() - clock0)/1000;\ndocument.getElementById('joinBtn').onclick = () => arrive();\n\n// ---------- walking camera ----------\nconst pos = new THREE.Vector3(0, 1.6, 4.4);\nlet yaw = 0, pitch = -.04;\nconst views = {\n  entry: {p:[0,1.6,4.4], yaw:0, pitch:-.04},\n  near: {p:[-1.4,1.6,-1.7], yaw:0, pitch:.08},\n  floor:{p:[-3,1.6,3.9], yaw:0, pitch:-.62},\n  over: {p:[5.6,3.9,4.3], yaw:-.7, pitch:-.42},\n  screen:{p:[3.45,1.65,-2.2], yaw:0, pitch:.04},\n  hall:{p:[5.9,1.6,-6.0], yaw:0, pitch:-.3},\n};\nlet tween = null;\nfunction goView(name){\n  const v = views[name];\n  tween = {from:{p:pos.clone(), yaw, pitch}, to:{p:new THREE.Vector3(...v.p), yaw:v.yaw, pitch:v.pitch}, t0: performance.now(), dur: 1400};\n  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));\n}\ndocument.querySelectorAll('[data-view]').forEach(b => b.onclick = () => goView(b.dataset.view));\n\nlet dragging = false, lx = 0, ly = 0;\ncanvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); tween = null; });\ncanvas.addEventListener('pointermove', e => {\n  if (!dragging) return;\n  yaw += (e.clientX - lx) * .004; pitch -= (e.clientY - ly) * .004;\n  pitch = Math.max(-1.3, Math.min(1.1, pitch)); lx = e.clientX; ly = e.clientY;\n});\ncanvas.addEventListener('pointerup', () => dragging = false);\nconst keys = {};\ncanvas.tabIndex = 0;\ncanvas.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });\ncanvas.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });\ncanvas.addEventListener('pointerdown', () => canvas.focus());\n\nfunction resize(){\n  const w = innerWidth, h = innerHeight;\n  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();\n}\naddEventListener('resize', resize); resize();\n\nconst ease = x => x<.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;\nlet last = performance.now(), nearS = 0;\nfunction frame(){\n  const tnow = performance.now(), dt = Math.min(.05, (tnow - last)/1000); last = tnow;\n  if (tween){\n    const e = ease(Math.min(1, (tnow - tween.t0)/tween.dur));\n    pos.lerpVectors(tween.from.p, tween.to.p, e);\n    yaw = tween.from.yaw + (tween.to.yaw - tween.from.yaw)*e;\n    pitch = tween.from.pitch + (tween.to.pitch - tween.from.pitch)*e;\n    if (e >= 1) tween = null;\n  }\n  const sp = 2.6*dt; let mx = 0, mz = 0;\n  if (keys['w']||keys['arrowup']) mz -= 1; if (keys['s']||keys['arrowdown']) mz += 1;\n  if (keys['a']||keys['arrowleft']) mx -= 1; if (keys['d']||keys['arrowright']) mx += 1;\n  if (mx||mz){ tween = null;\n    pos.x += (mx*Math.cos(yaw) - mz*Math.sin(yaw))*sp;\n    pos.z += (mx*Math.sin(yaw) + mz*Math.cos(yaw))*sp;\n    const cl = (v, a, b) => Math.max(a, Math.min(b, v));\n    if (pos.z < zMin + .3){ pos.x = cl(pos.x, CX0 + .35, CX1 - .35); pos.z = Math.max(CZ1 + .5, pos.z); }\n    else { pos.x = cl(pos.x, xMin + .4, xMax - .4); pos.z = Math.min(zMax - .3, pos.z);\n      if (pos.z < zMin + .5 && !(pos.x > CX0 + .35 && pos.x < CX1 - .35)) pos.z = zMin + .5; }\n  }\n  // corridor walker: slow loop, turns at each end\n  { const tw = performance.now()/1000, len = zMin - .6 - (CZ1 + 1), ph = (tw/18) % 2, k = ph < 1 ? ph : 2 - ph;\n    walker.position.z = CZ1 + 1 + len*k; walker.rotation.y = ph < 1 ? Math.PI : 0;\n    walker.position.y = Math.abs(Math.sin(tw*5))*.03;\n    const near = Math.min(Math.hypot(pos.x - CXM, pos.z - CPZ), Math.abs(walker.position.z - CPZ));\n    const target = THREE.MathUtils.clamp(1 - (near - 1.2)/2.8, 0, 1);\n    hallGlow += (target - hallGlow)*.06;\n    projHall.material.opacity = (mode === 'day' ? .45 : 1)*(.15 + .85*hallGlow);\n    pC.beam.material.opacity = (mode === 'day' ? .01 : .035)*(.3 + .7*hallGlow); }\n  camera.position.copy(pos);\n  camera.rotation.set(pitch, -yaw, 0, 'YXZ');\n\n  const t = now();\n  drawUI(t); scrTex.needsUpdate = true;\n  drawFloorUI(t); floorTex.needsUpdate = true;\n  renderer.render(scene, camera);\n  requestAnimationFrame(frame);\n}\nsetMode('evening');\nPromise.all([document.fonts.load('700 40px Inter'), document.fonts.load('40px Silkscreen'), document.fonts.load('40px \"Pixelify Sans\"'), document.fonts.load('600 40px \"Pixelify Sans\"')]).finally(() => {\n  document.getElementById('loading').remove();\n  requestAnimationFrame(frame);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"num": "V2", "name": "Welcome Carpet", "desc": "Far away: just breathing lights. Come closer and words appear. In the corridor, light pools under your feet and icons grow.", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Berkeley Looks Out · V2 Welcome Carpet<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--blue:#002676;--deep:#001a52;--line:#3a5da8;--gold:#FDB515;--paper:#FAF6EC;--ink:#0b1b3f;--on2:#C9D3EA;--glow:#FDB515}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#000;font-family:Inter,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;color:var(--paper);overflow:hidden}\n  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}\n  #c:active{cursor:grabbing}\n  .card{position:fixed;left:20px;top:20px;max-width:380px;background:rgba(0,38,118,.94);border:2px solid var(--line);border-radius:0;padding:16px 18px;box-shadow:0 6px 18px rgba(0,13,51,.25);backdrop-filter:blur(6px)}\n  .eyebrow{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.3em;color:var(--glow);margin:0 0 8px}\n  h1{font-family:'Pixelify Sans',sans-serif;font-size:21px;line-height:27px;margin:0 0 6px;font-weight:600;text-shadow:none}\n  .card p{font-size:13px;line-height:19px;color:var(--on2);margin:0}\n  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:calc(100% - 24px);background:rgba(0,38,118,.94);padding:10px;border:2px solid var(--line);backdrop-filter:blur(6px)}\n  .group{display:flex;gap:6px;align-items:center}\n  .sep{width:1px;height:28px;background:rgba(201,211,234,.35);margin:0 4px}\n  button{font:400 12px/1 Silkscreen,monospace;letter-spacing:.14em;color:var(--paper);background:transparent;border:2px solid rgba(201,211,234,.45);border-radius:0;padding:10px 12px;min-height:40px;cursor:pointer;white-space:nowrap}\n  button:hover{background:rgba(255,255,255,.16)}\n  button[aria-pressed=\"true\"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n  button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}\n  button.primary:hover{background:#ffc94d}\n  .hint{position:fixed;right:20px;top:20px;font-size:12px;line-height:18px;color:var(--on2);background:rgba(0,26,82,.85);padding:8px 12px;border-radius:10px;text-align:right}\n  .note{position:fixed;right:20px;top:72px;max-width:260px;font-size:12px;line-height:18px;color:var(--ink);background:var(--gold);padding:8px 12px;display:none}\n  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--on2);background:var(--deep)}\n  @media (max-width:640px){.card{max-width:calc(100% - 40px)}.hint{display:none}.note{top:auto;bottom:150px;right:12px}}\n<\/style>\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\"}}\n<\/script>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Walkable 3D interior with projections\"><\/canvas>\n<div id=\"loading\">Loading…<\/div>\n\n<div class=\"card\">\n  <div class=\"eyebrow\">BERKELEY LOOKS OUT<\/div>\n  <h1>V2 · Welcome Carpet<\/h1>\n  <p>Far away: just breathing lights. Come closer and words appear. In the corridor, light pools under your feet and icons grow.<\/p>\n<\/div>\n\n<div class=\"hint\">Drag to look · WASD / arrows to walk<\/div>\n<div class=\"note\" id=\"note\">Daylight washes out projections. In airport tests, floor projections went almost unnoticed by day.<\/div>\n\n<div class=\"bar\" role=\"toolbar\" aria-label=\"Simulation controls\">\n  <div class=\"group\" role=\"group\" aria-label=\"Views\">\n    <button data-view=\"entry\" aria-pressed=\"true\">ENTRANCE<\/button>\n    <button data-view=\"near\">WALL<\/button>\n    <button data-view=\"screen\">SCREEN<\/button>\n    <button data-view=\"floor\">FLOOR<\/button>\n    <button data-view=\"hall\">CORRIDOR<\/button>\n    <button data-view=\"over\">OVERVIEW<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <div class=\"group\" role=\"group\" aria-label=\"Lighting\">\n    <button id=\"dayBtn\" aria-pressed=\"false\">DAY<\/button>\n    <button id=\"eveBtn\" aria-pressed=\"true\">NIGHT<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <button id=\"joinBtn\" class=\"primary\">SOMEONE JOINS<\/button>\n<\/div>\n\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;\n\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color('#0b0f18');\nconst camera = new THREE.PerspectiveCamera(62, 1, 0.05, 80);\n\n// ---------- room: 14m x 10m x 4.5m ----------\nconst W = 14, D = 10, H = 4.5;\nconst xMin = -W/2, xMax = W/2, zMin = -D/2, zMax = D/2;\n\nfunction canvasTex(w, h, draw, repeat){\n  const c = document.createElement('canvas'); c.width = w; c.height = h;\n  draw(c.getContext('2d'), w, h);\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  t.anisotropy = 8;\n  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }\n  return t;\n}\nfunction rand(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }\n\n// polished concrete\nconst concreteTex = canvasTex(512, 512, (g, w, h) => {\n  g.fillStyle = '#8b8e90'; g.fillRect(0,0,w,h);\n  const r = rand(7);\n  for (let i=0;i<9000;i++){ const v = 110 + r()*60; g.fillStyle = `rgba(${v},${v+2},${v+4},${0.08+r()*0.1})`; g.fillRect(r()*w, r()*h, 1+r()*3, 1+r()*3); }\n  g.strokeStyle = 'rgba(60,62,66,.35)'; g.lineWidth = 2; g.strokeRect(0,0,w,h);\n}, [6, 4]);\nconst floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: concreteTex, roughness: .32, metalness: .08}));\nfloor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);\n\n// perforated plywood (Jacobs foyer signature)\nfunction plywoodTex(seed, clusters){\n  return canvasTex(1024, 1024, (g, w, h) => {\n    g.fillStyle = '#e8d9bd'; g.fillRect(0,0,w,h);\n    const r = rand(seed);\n    for (let i=0;i<40;i++){ g.fillStyle = `rgba(190,160,115,${0.05+r()*0.06})`; g.fillRect(0, r()*h, w, 2+r()*10); }\n    g.strokeStyle = 'rgba(150,120,80,.5)'; g.lineWidth = 3;\n    for (let x=0;x<=w;x+=256) { g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }\n    g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();\n    const sp = 22;\n    for (let y=sp/2;y<h;y+=sp) for (let x=sp/2;x<w;x+=sp){\n      let wgt = 0;\n      for (const [cx,cy,rr] of clusters){ const d = Math.hypot(x-cx, y-cy); wgt = Math.max(wgt, 1 - d/rr); }\n      if (wgt <= 0 || r() > wgt*1.6) continue;\n      g.fillStyle = '#d4682b'; g.beginPath(); g.arc(x, y, 3 + wgt*5, 0, Math.PI*2); g.fill();\n    }\n  });\n}\nconst wallPly = plywoodTex(11, [[260,300,260],[620,240,220],[520,700,280],[900,620,200]]);\nconst ceilPly = plywoodTex(23, [[200,200,500],[800,700,500],[500,500,300]]);\nceilPly.wrapS = ceilPly.wrapT = THREE.RepeatWrapping; ceilPly.repeat.set(3,2);\n\nconst white = new THREE.MeshStandardMaterial({color:'#e9ecee', roughness:.9});\nconst teal = new THREE.MeshStandardMaterial({color:'#8fb2b4', roughness:.85});\nfunction wall(w, h, mat, pos, rotY){\n  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);\n  m.position.set(...pos); m.rotation.y = rotY; m.receiveShadow = true; scene.add(m); return m;\n}\n// corridor opening on the right of the back wall\nconst CX0 = 4.8, CX1 = 7.0, CZ1 = zMin - 12, CH = 3.0, CXM = (CX0 + CX1)/2;\nwall(CX0 - xMin, H, white, [(xMin + CX0)/2, H/2, zMin], 0);                // back wall: projection surface\nwall(CX1 - CX0, H - CH, white, [CXM, (H + CH)/2, zMin], 0);                  // lintel over corridor\nwall(D, H, new THREE.MeshStandardMaterial({map: wallPly, roughness:.8}), [xMin, H/2, 0], Math.PI/2); // plywood wall\nwall(W, H, teal, [0, H/2, zMax], Math.PI);                                // front wall\nconst ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: ceilPly, roughness:.9}));\nceil.rotation.x = Math.PI/2; ceil.position.y = H; scene.add(ceil);\n\n// orange trim (like the foyer)\nconst orange = new THREE.MeshStandardMaterial({color:'#e2662a', roughness:.6});\nconst trim = new THREE.Mesh(new THREE.BoxGeometry(.08, .14, D), orange); trim.position.set(xMin+.04, H-.07, 0); scene.add(trim);\n\n// window wall (right)\nconst paneMat = new THREE.MeshBasicMaterial({color:'#cfe3f1'});\nconst frameMat = new THREE.MeshStandardMaterial({color:'#5d6570', roughness:.5, metalness:.4});\nwall(D, H, new THREE.MeshStandardMaterial({color:'#5d6570'}), [xMax+.02, H/2, 0], -Math.PI/2);\nfor (let i=0;i<5;i++){\n  const pz = zMin + 1 + i*2;\n  const pane = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 3.6), paneMat);\n  pane.position.set(xMax-.01, 2.1, pz); pane.rotation.y = -Math.PI/2; scene.add(pane);\n}\nfor (let i=0;i<=5;i++){ const f = new THREE.Mesh(new THREE.BoxGeometry(.1, H, .12), frameMat); f.position.set(xMax-.05, H/2, zMin + i*2); scene.add(f); }\nconst sill = new THREE.Mesh(new THREE.BoxGeometry(.1,.1,D), frameMat); sill.position.set(xMax-.05, .28, 0); scene.add(sill);\n\n// doorway in back wall\n\n\n// furniture: workbenches + stools + bench\nconst wood = new THREE.MeshStandardMaterial({color:'#d8b98c', roughness:.6});\nconst steel = new THREE.MeshStandardMaterial({color:'#e7e9ec', roughness:.4, metalness:.3});\nfunction box(w,h,d,mat,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; }\nfunction bench(x,z,rot=0){\n  const g = new THREE.Group();\n  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2,.08,.9), wood); top.position.y = .92; top.castShadow = true; g.add(top);\n  for (const [lx,lz] of [[-1,-.38],[1,-.38],[-1,.38],[1,.38]]){ const l = new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.06), steel); l.position.set(lx,.45,lz); l.castShadow = true; g.add(l); }\n  const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.1,.03,.8), steel); shelf.position.y = .25; g.add(shelf);\n  g.position.set(x,0,z); g.rotation.y = rot; scene.add(g);\n}\nbench(3.6, -.6); bench(3.6, 2.2);\nfunction stool(x,z){ const s = new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.05,20), new THREE.MeshStandardMaterial({color:'#7c8188'})); s.position.set(x,.68,z); s.castShadow = true; scene.add(s); const l = new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,.66,8), steel); l.position.set(x,.33,z); scene.add(l); }\nstool(2.7,.2); stool(4.5,.2); stool(3.2,3.0);\nbox(2.4,.08,.55, wood, -5.9, .46, 2.6); box(.08,.42,.4, steel, -6.9, .21, 2.6); box(.08,.42,.4, steel, -4.9, .21, 2.6);\n\n// people (scale + they catch the projection beam)\nfunction person(x,z,color,ry=0){\n  const g = new THREE.Group();\n  const mat = new THREE.MeshStandardMaterial({color, roughness:.8});\n  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.85,12), new THREE.MeshStandardMaterial({color:'#2b3446'})); legs.position.y = .43; g.add(legs);\n  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,.45,6,12), mat); body.position.y = 1.18; g.add(body);\n  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16), new THREE.MeshStandardMaterial({color:'#c99f7e'})); head.position.y = 1.62; g.add(head);\n  g.traverse(o => { if (o.isMesh) o.castShadow = true; });\n  g.position.set(x,0,z); g.rotation.y = ry; scene.add(g);\n}\nperson(3.1, .45, '#3f7e6c'); person(4.6, 2.9, '#c9a227', Math.PI); person(-1.2, -2.4, '#7a8fb8', .3);\n\n// ---------- lighting ----------\nconst hemi = new THREE.HemisphereLight('#dfe8f5', '#3a3530', .3);\nscene.add(hemi);\nconst sun = new THREE.DirectionalLight('#fff4e0', .3);\nsun.position.set(14, 7, 2); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);\nObject.assign(sun.shadow.camera, {left:-9,right:9,top:6,bottom:-6,near:1,far:40});\nscene.add(sun);\nconst downs = [];\nfor (const [x,z] of [[-4,-2],[0,-2],[4,-2],[-4,2.5],[0,2.5],[4,2.5]]){\n  const p = new THREE.PointLight('#ffd9a8', 2.2, 7, 2); p.position.set(x, H-.15, z); scene.add(p); downs.push(p);\n  const can = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.12,16), new THREE.MeshBasicMaterial({color:'#fff3df'})); can.position.set(x, H-.06, z); scene.add(can);\n}\n\n// ---------- the team's \"Pixel Go\" Resource Wall (night mode), drawn once and used on\n// the entrance screen, the wall projection and the floor projection ----------\nconst I = {\n  kit:[\"....####....\",\"....#..#....\",\"############\",\"#. clone().sub(pos).normalize(); lens.position.copy(pos).addScaledVector(dir, .19); scene.add(lens);\n  // pyramid beam\n  const len = target.distanceTo(pos);\n  const geo = new THREE.ConeGeometry(Math.hypot(w,h)/2, len, 4, 1, true);\n  const half = Math.hypot(w,h)/2/Math.SQRT2;\n  geo.rotateY(Math.PI/4); geo.scale((w/2)/half, 1, (h/2)/half); geo.translate(0, -len/2, 0); geo.rotateX(-Math.PI/2);\n  const beam = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:'#fff1cf', transparent:true, opacity:.035, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));\n  beam.position.copy(lens.position); beam.lookAt(target); scene.add(beam);\n  const spill = new THREE.SpotLight('#fff1d6', 6, len*1.4, Math.atan(Math.max(w,h)/2/len)*1.05, .5, 1.2);\n  spill.position.copy(lens.position); spill.target.position.copy(target); scene.add(spill); scene.add(spill.target);\n  return {beam, spill};\n}\nconst pA = projector(new THREE.Vector3(-1.4, 4.1, -.6), new THREE.Vector3(-1.4, 2.35, zMin), 6.0, 3.375);\nconst pB = projector(new THREE.Vector3(-3, 4.15, 2.6), new THREE.Vector3(-3, 0, 1.4), 3.6, 2.025);\npB.spill.intensity = 1.2;   // icons only: keep the floor from looking like a lit screen\n\n// ---------- corridor (2.2m x 12m), like the side corridor off the Jacobs foyer ----------\n{\n  const L = zMin - CZ1, zc = (zMin + CZ1)/2;\n  const cf = new THREE.Mesh(new THREE.PlaneGeometry(CX1 - CX0, L), floor.material); cf.rotation.x = -Math.PI/2; cf.position.set(CXM, 0, zc); cf.receiveShadow = true; scene.add(cf);\n  const cc = new THREE.Mesh(new THREE.PlaneGeometry(CX1 - CX0, L), new THREE.MeshStandardMaterial({map: ceilPly, roughness:.9})); cc.rotation.x = Math.PI/2; cc.position.set(CXM, CH, zc); scene.add(cc);\n  wall(L, CH, teal, [CX0, CH/2, zc], Math.PI/2);\n  wall(L, CH, white, [CX1, CH/2, zc], -Math.PI/2);\n  wall(CX1 - CX0, CH, new THREE.MeshBasicMaterial({color:'#dfe9f2'}), [CXM, CH/2, CZ1], 0);   // glass door at the end\n  for (const dz of [-.4, .4]) box(.05, 2.6, .05, frameMat, CXM + dz, 1.3, CZ1 + .03);\n  box(CX1 - CX0, .08, .06, frameMat, CXM, 2.6, CZ1 + .03);\n  const doorMat = new THREE.MeshStandardMaterial({color:'#c9cdd3', roughness:.5, metalness:.2});\n  for (const z of [zMin - 3.2, zMin - 8.4]){\n    const d = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 2.2), doorMat); d.position.set(CX0 + .01, 1.1, z); d.rotation.y = Math.PI/2; scene.add(d);\n    box(.04, .3, .04, steel, CX0 + .05, 1.0, z + .38, false);\n  }\n  const base = new THREE.Mesh(new THREE.BoxGeometry(.02, .1, L), new THREE.MeshStandardMaterial({color:'#6c7378'})); base.position.set(CX0 + .01, .05, zc); scene.add(base);\n  for (const z of [zMin - 2, zMin - 6, zMin - 10]){\n    const pl = new THREE.PointLight('#ffd9a8', 1.6, 5, 2); pl.position.set(CXM, CH - .1, z); scene.add(pl); downs.push(pl);\n    const can = new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.08,16), new THREE.MeshBasicMaterial({color:'#fff3df'})); can.position.set(CXM, CH - .04, z); scene.add(can);\n  }\n}\n// corridor floor projection: same icons, lights up when someone walks by\nconst CPZ = zMin - 6.2;\nconst HL = 6.0, HW = 1.6;\nconst hallC = document.createElement('canvas'); hallC.width = 400; hallC.height = 1500;\nconst hctx = hallC.getContext('2d');\nconst hallTex = new THREE.CanvasTexture(hallC); hallTex.colorSpace = THREE.SRGBColorSpace;\nlet hallYs = [];\nfunction drawHall(t){\n  const g = hctx, N = NIGHT;\n  g.globalAlpha = 1; g.shadowBlur = 0; g.fillStyle = '#000'; g.fillRect(0, 0, 400, 1500);\n  for (const y of hallYs){   // light carpet pooling under whoever walks by (BMW welcome light)\n    const gr = g.createRadialGradient(200, y, 0, 200, y, 380);\n    gr.addColorStop(0, 'rgba(90,128,255,.34)'); gr.addColorStop(1, 'rgba(90,128,255,0)');\n    g.fillStyle = gr; g.fillRect(0, y - 380, 400, 760);\n  }\n  slots.filter(s => s.p && s.ico && s.off == null).slice(0, 6).forEach((s, i) => {\n    const y = 140 + i*245;\n    let d = 1e9; for (const py of hallYs) d = Math.min(d, Math.abs(py - y));\n    const b = Math.max(0, Math.min(1, 1 - (d - 60)/380));          // bloom (teamLab: grows where you are)\n    const br = .6 + .4*Math.sin(t*1.2 + i*1.3), P = 3 + 6*b;\n    const hg = g.createRadialGradient(200, y, 0, 200, y, 60 + 100*b);\n    hg.addColorStop(0, N.halo); hg.addColorStop(.7, 'rgba(90,128,255,0)');\n    g.globalAlpha = (.25 + .75*b)*br; g.fillStyle = hg; g.fillRect(0, y - 170, 400, 340); g.globalAlpha = 1;\n    drawIco(g, s.ico, 200, y + s.ico.h*P/2 - 20*b, (.3 + .7*b)*(b > .05 ? 1 : br), 1, false, 99, P);\n    if (b > .05){\n      g.save(); g.globalAlpha = b; g.textAlign = 'center'; g.shadowColor = N.glow; g.shadowBlur = 10;\n      const ty = y + s.ico.h*P/2 + 30;\n      if (s.p.n){ g.fillStyle = N.ink; g.font = '500 34px \"Pixelify Sans\"'; g.fillText(s.p.n, 200, ty);\n        g.fillStyle = N.mute; g.font = '24px \"Pixelify Sans\"'; g.fillText(s.p.r, 200, ty + 30); }\n      else { g.fillStyle = N.mute; g.font = '26px \"Pixelify Sans\"'; g.fillText(s.p.r, 200, ty); }\n      g.restore();\n    }\n  });\n}\nconst projHall = new THREE.Mesh(new THREE.PlaneGeometry(HW, HL), new THREE.MeshBasicMaterial({map: hallTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}));\nprojHall.rotation.x = -Math.PI/2; projHall.position.set(CXM, .012, CPZ); scene.add(projHall);\nconst pC = projector(new THREE.Vector3(CXM, 2.85, CPZ + .8), new THREE.Vector3(CXM, 0, CPZ), HW, HL);\npC.spill.intensity = .8;\n// someone walking up and down the corridor\nconst walker = new THREE.Group();\n{\n  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.85,12), new THREE.MeshStandardMaterial({color:'#2b3446'})); legs.position.y = .43; walker.add(legs);\n  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,.45,6,12), new THREE.MeshStandardMaterial({color:'#5b8fd6', roughness:.8})); body.position.y = 1.18; walker.add(body);\n  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16), new THREE.MeshStandardMaterial({color:'#b8876a'})); head.position.y = 1.62; walker.add(head);\n  const bag = new THREE.Mesh(new THREE.BoxGeometry(.3,.38,.16), new THREE.MeshStandardMaterial({color:'#2f6f5e'})); bag.position.set(0, 1.2, .2); walker.add(bag);\n  walker.traverse(o => o.isMesh && (o.castShadow = true));\n  walker.position.set(CXM - .35, 0, CZ1 + 1); scene.add(walker);\n}\nlet hallGlow = 0;\n\n// ---------- lighting modes ----------\nlet mode = 'evening';\nfunction setMode(m){\n  mode = m;\n  document.getElementById('dayBtn').setAttribute('aria-pressed', m==='day');\n  document.getElementById('eveBtn').setAttribute('aria-pressed', m==='evening');\n  document.getElementById('note').style.display = m==='day' ? 'block' : 'none';\n  if (m === 'day'){\n    hemi.intensity = 1.6; sun.intensity = 3.2; paneMat.color.set('#d9ecf8'); scene.background.set('#cfe3f1');\n    downs.forEach(p => p.intensity = .6); renderer.toneMappingExposure = 1.05;\n    projWall.material.opacity = .55; projFloor.material.opacity = .45;\n    [pA, pB].forEach(p => { p.beam.material.opacity = .012; });\n  } else {\n    hemi.intensity = .28; sun.intensity = .25; paneMat.color.set('#1f2c47'); scene.background.set('#0b0f18');\n    downs.forEach(p => p.intensity = 2.2); renderer.toneMappingExposure = 1.0;\n    projWall.material.opacity = 1; projFloor.material.opacity = 1;\n    [pA, pB].forEach(p => { p.beam.material.opacity = .035; });\n  }\n}\ndocument.getElementById('dayBtn').onclick = () => setMode('day');\ndocument.getElementById('eveBtn').onclick = () => setMode('evening');\n\n// someone joins\nlet clock0 = performance.now();\nconst now = () => (performance.now() - clock0)/1000;\ndocument.getElementById('joinBtn').onclick = () => arrive();\n\n// ---------- walking camera ----------\nconst pos = new THREE.Vector3(0, 1.6, 4.4);\nlet yaw = 0, pitch = -.04;\nconst views = {\n  entry: {p:[0,1.6,4.4], yaw:0, pitch:-.04},\n  near: {p:[-1.4,1.6,-1.7], yaw:0, pitch:.08},\n  floor:{p:[-3,1.6,3.9], yaw:0, pitch:-.62},\n  over: {p:[5.6,3.9,4.3], yaw:-.7, pitch:-.42},\n  screen:{p:[3.45,1.65,-2.2], yaw:0, pitch:.04},\n  hall:{p:[5.9,1.6,-6.0], yaw:0, pitch:-.3},\n};\nlet tween = null;\nfunction goView(name){\n  const v = views[name];\n  tween = {from:{p:pos.clone(), yaw, pitch}, to:{p:new THREE.Vector3(...v.p), yaw:v.yaw, pitch:v.pitch}, t0: performance.now(), dur: 1400};\n  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === name));\n}\ndocument.querySelectorAll('[data-view]').forEach(b => b.onclick = () => goView(b.dataset.view));\n\nlet dragging = false, lx = 0, ly = 0;\ncanvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); tween = null; });\ncanvas.addEventListener('pointermove', e => {\n  if (!dragging) return;\n  yaw += (e.clientX - lx) * .004; pitch -= (e.clientY - ly) * .004;\n  pitch = Math.max(-1.3, Math.min(1.1, pitch)); lx = e.clientX; ly = e.clientY;\n});\ncanvas.addEventListener('pointerup', () => dragging = false);\nconst keys = {};\ncanvas.tabIndex = 0;\ncanvas.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });\ncanvas.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });\ncanvas.addEventListener('pointerdown', () => canvas.focus());\n\nfunction resize(){\n  const w = innerWidth, h = innerHeight;\n  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();\n}\naddEventListener('resize', resize); resize();\n\nconst ease = x => x<.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;\nlet last = performance.now(), nearS = 0;\nfunction frame(){\n  const tnow = performance.now(), dt = Math.min(.05, (tnow - last)/1000); last = tnow;\n  if (tween){\n    const e = ease(Math.min(1, (tnow - tween.t0)/tween.dur));\n    pos.lerpVectors(tween.from.p, tween.to.p, e);\n    yaw = tween.from.yaw + (tween.to.yaw - tween.from.yaw)*e;\n    pitch = tween.from.pitch + (tween.to.pitch - tween.from.pitch)*e;\n    if (e >= 1) tween = null;\n  }\n  const sp = 2.6*dt; let mx = 0, mz = 0;\n  if (keys['w']||keys['arrowup']) mz -= 1; if (keys['s']||keys['arrowdown']) mz += 1;\n  if (keys['a']||keys['arrowleft']) mx -= 1; if (keys['d']||keys['arrowright']) mx += 1;\n  if (mx||mz){ tween = null;\n    pos.x += (mx*Math.cos(yaw) - mz*Math.sin(yaw))*sp;\n    pos.z += (mx*Math.sin(yaw) + mz*Math.cos(yaw))*sp;\n    const cl = (v, a, b) => Math.max(a, Math.min(b, v));\n    if (pos.z < zMin + .3){ pos.x = cl(pos.x, CX0 + .35, CX1 - .35); pos.z = Math.max(CZ1 + .5, pos.z); }\n    else { pos.x = cl(pos.x, xMin + .4, xMax - .4); pos.z = Math.min(zMax - .3, pos.z);\n      if (pos.z < zMin + .5 && !(pos.x > CX0 + .35 && pos.x < CX1 - .35)) pos.z = zMin + .5; }\n  }\n  // corridor walker: slow loop, turns at each end\n  { const tw = performance.now()/1000, len = zMin - .6 - (CZ1 + 1), ph = (tw/18) % 2, k = ph < 1 ? ph : 2 - ph;\n    walker.position.z = CZ1 + 1 + len*k; walker.rotation.y = ph < 1 ? Math.PI : 0;\n    walker.position.y = Math.abs(Math.sin(tw*5))*.03;\n    const toY = z => (z - (CPZ - HL/2))/HL*1500;\n    hallYs = [toY(walker.position.z)];\n    if (pos.z < zMin + .2 && pos.x > CX0 && pos.x < CX1) hallYs.push(toY(pos.z));\n    const near = Math.min(Math.hypot(pos.x - CXM, pos.z - CPZ), Math.abs(walker.position.z - CPZ));\n    const target = THREE.MathUtils.clamp(1 - (near - 1.2)/2.8, 0, 1);\n    hallGlow += (target - hallGlow)*.06;\n    projHall.material.opacity = mode === 'day' ? .5 : 1;\n    // room floor + wall: proximity layers\n    const fd = Math.hypot(pos.x + 3, pos.z - 1.4);\n    floorB += (THREE.MathUtils.clamp(1 - (fd - 1.8)/2.5, 0, 1) - floorB)*.06;\n    const wd = pos.z - zMin, wIn = Math.abs(pos.x + 1.4) < 4.5 && pos.z > zMin;\n    wallTextA += ((wIn ? THREE.MathUtils.clamp((5.5 - wd)/2.5, 0, 1) : 0) - wallTextA)*.06;\n    pC.beam.material.opacity = (mode === 'day' ? .01 : .035)*(.3 + .7*hallGlow); }\n  camera.position.copy(pos);\n  camera.rotation.set(pitch, -yaw, 0, 'YXZ');\n\n  const t = now();\n  drawUI(t); scrTex.needsUpdate = true;\n  drawFloorUI(t); floorTex.needsUpdate = true;\n  drawUI(t, wctx); wallTex.needsUpdate = true;\n  drawHall(t); hallTex.needsUpdate = true;\n  renderer.render(scene, camera);\n  requestAnimationFrame(frame);\n}\nsetMode('evening');\nPromise.all([document.fonts.load('700 40px Inter'), document.fonts.load('40px Silkscreen'), document.fonts.load('40px \"Pixelify Sans\"'), document.fonts.load('600 40px \"Pixelify Sans\"')]).finally(() => {\n  document.getElementById('loading').remove();\n  requestAnimationFrame(frame);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"num": "V3", "name": "Shadow Reveal", "desc": "The wall is washed in light. The Resource Wall shows only inside people's shadows.", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Berkeley Looks Out · V3 Shadow Reveal<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--blue:#002676;--deep:#001a52;--line:#3a5da8;--gold:#FDB515;--paper:#FAF6EC;--ink:#0b1b3f;--on2:#C9D3EA;--glow:#FDB515}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#000;font-family:Inter,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;color:var(--paper);overflow:hidden}\n  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}\n  #c:active{cursor:grabbing}\n  .card{position:fixed;left:20px;top:20px;max-width:380px;background:rgba(0,38,118,.94);border:2px solid var(--line);border-radius:0;padding:16px 18px;box-shadow:0 6px 18px rgba(0,13,51,.25);backdrop-filter:blur(6px)}\n  .eyebrow{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.3em;color:var(--glow);margin:0 0 8px}\n  h1{font-family:'Pixelify Sans',sans-serif;font-size:21px;line-height:27px;margin:0 0 6px;font-weight:600;text-shadow:none}\n  .card p{font-size:13px;line-height:19px;color:var(--on2);margin:0}\n  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:calc(100% - 24px);background:rgba(0,38,118,.94);padding:10px;border:2px solid var(--line);backdrop-filter:blur(6px)}\n  .group{display:flex;gap:6px;align-items:center}\n  .sep{width:1px;height:28px;background:rgba(201,211,234,.35);margin:0 4px}\n  button{font:400 12px/1 Silkscreen,monospace;letter-spacing:.14em;color:var(--paper);background:transparent;border:2px solid rgba(201,211,234,.45);border-radius:0;padding:10px 12px;min-height:40px;cursor:pointer;white-space:nowrap}\n  button:hover{background:rgba(255,255,255,.16)}\n  button[aria-pressed=\"true\"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n  button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}\n  button.primary:hover{background:#ffc94d}\n  .hint{position:fixed;right:20px;top:20px;font-size:12px;line-height:18px;color:var(--on2);background:rgba(0,26,82,.85);padding:8px 12px;border-radius:10px;text-align:right}\n  .note{position:fixed;right:20px;top:72px;max-width:260px;font-size:12px;line-height:18px;color:var(--ink);background:var(--gold);padding:8px 12px;display:none}\n  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--on2);background:var(--deep)}\n  @media (max-width:640px){.card{max-width:calc(100% - 40px)}.hint{display:none}.note{top:auto;bottom:150px;right:12px}}\n<\/style>\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\"}}\n<\/script>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Walkable 3D interior with projections\"><\/canvas>\n<div id=\"loading\">Loading…<\/div>\n\n<div class=\"card\">\n  <div class=\"eyebrow\">BERKELEY LOOKS OUT<\/div>\n  <h1>V3 · Shadow Reveal<\/h1>\n  <p>The wall is washed in light. The Resource Wall shows only inside people's shadows.<\/p>\n<\/div>\n\n<div class=\"hint\">Drag to look · WASD / arrows to walk<\/div>\n<div class=\"note\" id=\"note\">Daylight washes out projections. In airport tests, floor projections went almost unnoticed by day.<\/div>\n\n<div class=\"bar\" role=\"toolbar\" aria-label=\"Simulation controls\">\n  <div class=\"group\" role=\"group\" aria-label=\"Views\">\n    <button data-view=\"entry\" aria-pressed=\"true\">ENTRANCE<\/button>\n    <button data-view=\"near\">WALL<\/button>\n    <button data-view=\"screen\">SCREEN<\/button>\n    <button data-view=\"floor\">FLOOR<\/button>\n    <button data-view=\"hall\">CORRIDOR<\/button>\n    <button data-view=\"over\">OVERVIEW<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <div class=\"group\" role=\"group\" aria-label=\"Lighting\">\n    <button id=\"dayBtn\" aria-pressed=\"false\">DAY<\/button>\n    <button id=\"eveBtn\" aria-pressed=\"true\">NIGHT<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <button id=\"joinBtn\" class=\"primary\">SOMEONE JOINS<\/button>\n<\/div>\n\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;\n\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color('#0b0f18');\nconst camera = new THREE.PerspectiveCamera(62, 1, 0.05, 80);\n\n// ---------- room: 14m x 10m x 4.5m ----------\nconst W = 14, D = 10, H = 4.5;\nconst xMin = -W/2, xMax = W/2, zMin = -D/2, zMax = D/2;\n\nfunction canvasTex(w, h, draw, repeat){\n  const c = document.createElement('canvas'); c.width = w; c.height = h;\n  draw(c.getContext('2d'), w, h);\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  t.anisotropy = 8;\n  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }\n  return t;\n}\nfunction rand(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }\n\n// polished concrete\nconst concreteTex = canvasTex(512, 512, (g, w, h) => {\n  g.fillStyle = '#8b8e90'; g.fillRect(0,0,w,h);\n  const r = rand(7);\n  for (let i=0;i<9000;i++){ const v = 110 + r()*60; g.fillStyle = `rgba(${v},${v+2},${v+4},${0.08+r()*0.1})`; g.fillRect(r()*w, r()*h, 1+r()*3, 1+r()*3); }\n  g.strokeStyle = 'rgba(60,62,66,.35)'; g.lineWidth = 2; g.strokeRect(0,0,w,h);\n}, [6, 4]);\nconst floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: concreteTex, roughness: .32, metalness: .08}));\nfloor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);\n\n// perforated plywood (Jacobs foyer signature)\nfunction plywoodTex(seed, clusters){\n  return canvasTex(1024, 1024, (g, w, h) => {\n    g.fillStyle = '#e8d9bd'; g.fillRect(0,0,w,h);\n    const r = rand(seed);\n    for (let i=0;i<40;i++){ g.fillStyle = `rgba(190,160,115,${0.05+r()*0.06})`; g.fillRect(0, r()*h, w, 2+r()*10); }\n    g.strokeStyle = 'rgba(150,120,80,.5)'; g.lineWidth = 3;\n    for (let x=0;x<=w;x+=256) { g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }\n    g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();\n    const sp = 22;\n    for (let y=sp/2;y<h;y+=sp) for (let x=sp/2;x<w;x+=sp){\n      let wgt = 0;\n      for (const [cx,cy,rr] of clusters){ const d = Math.hypot(x-cx, y-cy); wgt = Math.max(wgt, 1 - d/rr); }\n      if (wgt <= 0 || r() > wgt*1.6) continue;\n      g.fillStyle = '#d4682b'; g.beginPath(); g.arc(x, y, 3 + wgt*5, 0, Math.PI*2); g.fill();\n    }\n  });\n}\nconst wallPly = plywoodTex(11, [[260,300,260],[620,240,220],[520,700,280],[900,620,200]]);\nconst ceilPly = plywoodTex(23, [[200,200,500],[800,700,500],[500,500,300]]);\nceilPly.wrapS = ceilPly.wrapT = THREE.RepeatWrapping; ceilPly.repeat.set(3,2);\n\nconst white = new THREE.MeshStandardMaterial({color:'#e9ecee', roughness:.9});\nconst teal = new THREE.MeshStandardMaterial({color:'#8fb2b4', roughness:.85});\nfunction wall(w, h, mat, pos, rotY){\n  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);\n  m.position.set(...pos); m.rotation.y = rotY; m.receiveShadow = true; scene.add(m); return m;\n}\n// corridor opening on the right of the back wall\nconst CX0 = 4.8, CX1 = 7.0, CZ1 = zMin - 12, CH = 3.0, CXM = (CX0 + CX1)/2;\nwall(CX0 - xMin, H, white, [(xMin + CX0)/2, H/2, zMin], 0);                // back wall: projection surface\nwall(CX1 - CX0, H - CH, white, [CXM, (H + CH)/2, zMin], 0);                  // lintel over corridor\nwall(D, H, new THREE.MeshStandardMaterial({map: wallPly, roughness:.8}), [xMin, H/2, 0], Math.PI/2); // plywood wall\nwall(W, H, teal, [0, H/2, zMax], Math.PI);                                // front wall\nconst ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: ceilPly, roughness:.9}));\nceil.rotation.x = Math.PI/2; ceil.position.y = H; scene.add(ceil);\n\n// orange trim (like the foyer)\nconst orange = new THREE.MeshStandardMaterial({color:'#e2662a', roughness:.6});\nconst trim = new THREE.Mesh(new THREE.BoxGeometry(.08, .14, D), orange); trim.position.set(xMin+.04, H-.07, 0); scene.add(trim);\n\n// window wall (right)\nconst paneMat = new THREE.MeshBasicMaterial({color:'#cfe3f1'});\nconst frameMat = new THREE.MeshStandardMaterial({color:'#5d6570', roughness:.5, metalness:.4});\nwall(D, H, new THREE.MeshStandardMaterial({color:'#5d6570'}), [xMax+.02, H/2, 0], -Math.PI/2);\nfor (let i=0;i<5;i++){\n  const pz = zMin + 1 + i*2;\n  const pane = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 3.6), paneMat);\n  pane.position.set(xMax-.01, 2.1, pz); pane.rotation.y = -Math.PI/2; scene.add(pane);\n}\nfor (let i=0;i<=5;i++){ const f = new THREE.Mesh(new THREE.BoxGeometry(.1, H, .12), frameMat); f.position.set(xMax-.05, H/2, zMin + i*2); scene.add(f); }\nconst sill = new THREE.Mesh(new THREE.BoxGeometry(.1,.1,D), frameMat); sill.position.set(xMax-.05, .28, 0); scene.add(sill);\n\n// doorway in back wall\n\n\n// furniture: workbenches + stools + bench\nconst wood = new THREE.MeshStandardMaterial({color:'#d8b98c', roughness:.6});\nconst steel = new THREE.MeshStandardMaterial({color:'#e7e9ec', roughness:.4, metalness:.3});\nfunction box(w,h,d,mat,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m; }\nfunction bench(x,z,rot=0){\n  const g = new THREE.Group();\n  const top = new THREE.Mesh(new THREE.BoxGeometry(2.2,.08,.9), wood); top.position.y = .92; top.castShadow = true; g.add(top);\n  for (const [lx,lz] of [[-1,-.38],[1,-.38],[-1,.38],[1,.38]]){ const l = new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.06), steel); l.position.set(lx,.45,lz); l.castShadow = true; g.add(l); }\n  const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.1,.03,.8), steel); shelf.position.y = .25; g.add(shelf);\n  g.position.set(x,0,z); g.rotation.y = rot; scene.add(g);\n}\nbench(3.6, -.6); bench(3.6, 2.2);\nfunction stool(x,z){ const s = new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.05,20), new THREE.MeshStandardMaterial({color:'#7c8188'})); s.position.set(x,.68,z); s.castShadow = true; scene.add(s); const l = new THREE.Mesh(new THREE.CylinderGeometry(.03,.05,.66,8), steel); l.position.set(x,.33,z); scene.add(l); }\nstool(2.7,.2); stool(4.5,.2); stool(3.2,3.0);\nbox(2.4,.08,.55, wood, -5.9, .46, 2.6); box(.08,.42,.4, steel, -6.9, .21, 2.6); box(.08,.42,.4, steel, -4.9, .21, 2.6);\n\n// people (scale + they catch the projection beam)\nfunction person(x,z,color,ry=0){\n  const g = new THREE.Group();\n  const mat = new THREE.MeshStandardMaterial({color, roughness:.8});\n  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.85,12), new THREE.MeshStandardMaterial({color:'#2b3446'})); legs.position.y = .43; g.add(legs);\n  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,.45,6,12), mat); body.position.y = 1.18; g.add(body);\n  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16), new THREE.MeshStandardMaterial({color:'#c99f7e'})); head.position.y = 1.62; g.add(head);\n  g.traverse(o => { if (o.isMesh) o.castShadow = true; });\n  g.position.set(x,0,z); g.rotation.y = ry; scene.add(g);\n}\nperson(3.1, .45, '#3f7e6c'); person(4.6, 2.9, '#c9a227', Math.PI); person(-1.2, -2.4, '#7a8fb8', .3);\n\n// ---------- lighting ----------\nconst hemi = new THREE.HemisphereLight('#dfe8f5', '#3a3530', .3);\nscene.add(hemi);\nconst sun = new THREE.DirectionalLight('#fff4e0', .3);\nsun.position.set(14, 7, 2); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);\nObject.assign(sun.shadow.camera, {left:-9,right:9,top:6,bottom:-6,near:1,far:40});\nscene.add(sun);\nconst downs = [];\nfor (const [x,z] of [[-4,-2],[0,-2],[4,-2],[-4,2.5],[0,2.5],[4,2.5]]){\n  const p = new THREE.PointLight('#ffd9a8', 2.2, 7, 2); p.position.set(x, H-.15, z); scene.add(p); downs.push(p);\n  const can = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.12,16), new THREE.MeshBasicMaterial({color:'#fff3df'})); can.position.set(x, H-.06, z); scene.add(can);\n}\n\n// ---------- the team's \"Pixel Go\" Resource Wall (night mode), drawn once and used on\n// the entrance screen, the wall projection and the floor projection ----------\nconst I = {\n  kit:[\"....####....\",\"....#..#....\",\"############\",\"#..........#\",\"#....##....#\",\"#....##....#\",\"#..######..#\",\"#..######..#\",\"#....##....#\",\"#....##....#\",\"#..........#\",\"############\"],\n  helmet:[\".....####.....\",\"...##.##.##...\",\"..#...##...#..\",\".#....##....#.\",\".#....##....#.\",\"#.....##.....#\",\"##############\",\"#............#\",\".############.\"],\n  bike:[\"..........###...\",\"...###.....#....\",\"....#.....#.....\",\"....######......\",\"...#.#...#.#....\",\".###..#.#..###..\",\"#...#..#..#...#.\",\"#..#.#...#.#..#.\",\"#...#.....#...#.\",\".###.......###..\"],\n  pot:[\"..#..#..#...\",\"...#..#..#..\",\"............\",\"...######...\",\".##########.\",\"#.#......#.#\",\"..#......#..\",\"..#......#..\",\"..#......#..\",\"...######...\"],\n  plant:[\".......###.\",\".....##..#.\",\"..##.#..#..\",\".#..##.#...\",\".#...##....\",\"..#..#.....\",\"...###.....\",\".....#.....\",\".....#.....\",\"...#####...\",\"...#...#...\",\"....###....\"],\n  books:[\"############\",\"#..........#\",\"############\",\".##########.\",\".#........#.\",\".##########.\",\"############\",\"#..........#\",\"############\"],\n  laptop:[\"..##########..\",\"..#........#..\",\"..#........#..\",\"..#........#..\",\"..#........#..\",\"..##########..\",\".############.\",\"#............#\",\"##############\"],\n  bubble:[\".##########.\",\"#..........#\",\"#.########.#\",\"#..........#\",\"#.######...#\",\"#..........#\",\".###..#####.\",\"...#.#......\",\"...##.......\",\"...#........\"],\n  wrench:[\"........##..\",\".......#..#.\",\".......#..##\",\"......#....#\",\".....#...##.\",\"....#...#...\",\"...#...#....\",\"..#...#.....\",\".#...#......\",\"#...#.......\",\"#..#........\",\".##.........\"],\n  camera:[\"....####.....\",\"############.\",\"#..........#.\",\"#...####...#.\",\"#..#....#..#.\",\"#..#....#..#.\",\"#...####...#.\",\"#..........#.\",\"############.\"],\n  tent:[\"......#......\",\".....#.#.....\",\"....#...#....\",\"...#..#..#...\",\"..#..#.#..#..\",\".#..#...#..#.\",\"#..#.....#..#\",\"#############\"],\n  heart:[\".###...###.\",\"#...#.#...#\",\"#....#....#\",\"#.........#\",\".#.......#.\",\"..#.....#..\",\"...#...#...\",\"....#.#....\",\".....#.....\"],\n  plus:[\"....##....\",\"....##....\",\"....##....\",\"##########\",\"##########\",\"....##....\",\"....##....\",\"....##....\"]\n};\nconst NIGHT = {bg:'#04060E', ink:'#DCE6FF', hue:'#7C9CFF', px:'#B4C8FF', mute:'#93A6DD', glow:'rgba(120,155,255,.95)', blob:'rgba(58,96,255,.45)', halo:'rgba(90,128,255,.45)', line:'rgba(124,156,255,.4)'};\nconst slots = [];\nconst start = [\n  {i:'kit',n:'alex',r:'first aid'},{i:'helmet',n:'',r:'NERT · verified'},{i:'pot',n:'priya',r:'cooking'},{i:'plant',n:'leah',r:'plant care'},{i:'bike',n:'sam',r:'bike repairs'},\n  {i:'laptop',n:'chris',r:'tech help'},{i:'bubble',n:'taylor',r:'speaks spanish'},{i:'wrench',n:'jamie',r:'basic repairs'},{i:'books',n:'',r:'study help'},{i:'camera',n:'riley',r:'photography'},\n  {i:'tent',n:'drew',r:'camping gear'},{i:'heart',n:'emily',r:'listening ear'},null,null,'plus'\n];\nconst pool = [{i:'bike',n:'kai',r:'bike pump to lend'},{i:'kit',n:'mo',r:'first aid'},{i:'bubble',n:'lin',r:'speaks mandarin'},{i:'helmet',n:'',r:'NERT · verified'},{i:'plant',n:'ana',r:'plant care'},{i:'pot',n:'',r:'cooking'},{i:'camera',n:'jo',r:'photography'},{i:'wrench',n:'ben',r:'basic repairs'}];\nfunction cellsOf(key){ const rows = I[key], w = Math.max(...rows.map(r => r.length)), out = [];\n  rows.forEach((line, y) => { for (let x=0;x<w;x++) if (line[x] === '#') out.push({x, y, d: Math.random()*.65}); });\n  return {w, h: rows.length, cells: out}; }\nstart.forEach((p, k) => slots.push(p === 'plus' ? {plus:true, ico:cellsOf('plus'), on:-99, hd:-Math.random()*5}\n  : {p, ico: p ? cellsOf(p.i) : null, on: p ? -99 : null, off:null, hd:-Math.random()*5}));\nlet tick = 'Only people who opted in appear here';\nconst liveCount = () => slots.filter(s => s.p).length;\n\nconst uiC = document.createElement('canvas'); uiC.width = 1600; uiC.height = 900;\nconst ug = uiC.getContext('2d');\nfunction spacedText(g, text, x, y, sp, align){\n  let w = 0; for (const ch of text) w += g.measureText(ch).width + sp; w -= sp;\n  let cx = align ({map: floorTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}));\nprojHall.rotation.x = -Math.PI/2; projHall.position.set(CXM, .012, CPZ); scene.add(projHall);\nconst pC = projector(new THREE.Vector3(CXM, 2.85, CPZ + 1.6), new THREE.Vector3(CXM, 0, CPZ), 2.0, 1.125);\npC.spill.intensity = .8;\n// someone walking up and down the corridor\nconst walker = new THREE.Group();\n{\n  const legs = new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.85,12), new THREE.MeshStandardMaterial({color:'#2b3446'})); legs.position.y = .43; walker.add(legs);\n  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.2,.45,6,12), new THREE.MeshStandardMaterial({color:'#5b8fd6', roughness:.8})); body.position.y = 1.18; walker.add(body);\n  const head = new THREE.Mesh(new THREE.SphereGeometry(.12,16,16), new THREE.MeshStandardMaterial({color:'#b8876a'})); head.position.y = 1.62; walker.add(head);\n  const bag = new THREE.Mesh(new THREE.BoxGeometry(.3,.38,.16), new THREE.MeshStandardMaterial({color:'#2f6f5e'})); bag.position.set(0, 1.2, .2); walker.add(bag);\n  walker.traverse(o => o.isMesh && (o.castShadow = true));\n  walker.position.set(CXM - .35, 0, CZ1 + 1); scene.add(walker);\n}\nlet hallGlow = 0;\n\n// ---------- lighting modes ----------\nlet mode = 'evening';\nfunction setMode(m){\n  mode = m;\n  document.getElementById('dayBtn').setAttribute('aria-pressed', m==='day');\n  document.getElementById('eveBtn').setAttribute('aria-pressed', m==='evening');\n  document.getElementById('note').style.display = m==='day' ? 'block' : 'none';\n  if (m === 'day'){\n    hemi.intensity = 1.6; sun.intensity = 3.2; paneMat.color.set('#d9ecf8'); scene.background.set('#cfe3f1');\n    downs.forEach(p => p.intensity = .6); renderer.toneMappingExposure = 1.05;\n    projWall.material.opacity = .55; projFloor.material.opacity = .45;\n    [pA, pB].forEach(p => { p.beam.material.opacity = .012; });\n  } else {\n    hemi.intensity = .28; sun.intensity = .25; paneMat.c [e.key.toLowerCase()] = true; if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });\ncanvas.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });\ncanvas.addEventListener('pointerdown', () => canvas.focus());\n\nfunction resize(){\n  const w = innerWidth, h = innerHeight;\n  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();\n}\naddEventListener('resize', resize); resize();\n\nconst ease = x => x<.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;\nlet last = performance.now(), nearS = 0;\nfunction frame(){\n  const tnow = performance.now(), dt = Math.min(.05, (tnow - last)/1000); last = tnow;\n  if (tween){\n    const e = ease(Math.min(1, (tnow - tween.t0)/tween.dur));\n    pos.lerpVectors(tween.from.p, tween.to.p, e);\n    yaw = tween.from.yaw + (tween.to.yaw - tween.from.yaw)*e;\n    pitch = tween.from.pitch + (tween.to.pitch - tween.from.pitch)*e;\n    if (e >= 1) tween = null;\n  }\n  const sp = 2.6*dt; let mx = 0, mz = 0;\n  if (keys['w']||keys['arrowup']) mz -= 1; if (keys['s']||keys['arrowdown']) mz += 1;\n  if (keys['a']||keys['arrowleft']) mx -= 1; if (keys['d']||keys['arrowright']) mx += 1;\n  if (mx||mz){ tween = null;\n    pos.x += (mx*Math.cos(yaw) - mz*Math.sin(yaw))*sp;\n    pos.z += (mx*Math.sin(yaw) + mz*Math.cos(yaw))*sp;\n    const cl = (v, a, b) => Math.max(a, Math.min(b, v));\n    if (pos.z < zMin + .3){ pos.x = cl(pos.x, CX0 + .35, CX1 - .35); pos.z = Math.max(CZ1 + .5, pos.z); }\n    else { pos.x = cl(pos.x, xMin + .4, xMax - .4); pos.z = Math.min(zMax - .3, pos.z);\n      if (pos.z < zMin + .5 && !(pos.x > CX0 + .35 && pos.x < CX1 - .35)) pos.z = zMin + .5; }\n  }\n  // corridor walker: slow loop, turns at each end\n  { const tw = performance.now()/1000, len = zMin - .6 - (CZ1 + 1), ph = (tw/18) % 2, k = ph < 1 ? ph : 2 - ph;\n    walker.position.z = CZ1 + 1 + len*k; walker.rotation.y = ph < 1 ? Math.PI : 0;\n    walker.position.y = Math.abs(Math.sin(tw*5))*.03;\n    const near = Math.min(Math.hypot(pos.x - CXM, pos.z - CPZ), Math.abs(walker.position.z - CPZ));\n    const target = THREE.MathUtils.clamp(1 - (near - 1.2)/2.8, 0, 1);\n    hallGlow += (target - hallGlow)*.06;\n    projHall.material.opacity = (mode === 'day' ? .45 : 1)*(.15 + .85*hallGlow);\n    pC.beam.material.opacity = (mode === 'day' ? .01 : .035)*(.3 + .7*hallGlow); }\n  camera.position.copy(pos);\n  camera.rotation.set(pitch, -yaw, 0, 'YXZ');\n\n  const t = now();\n  { const tw = performance.now()/1000, k = (Math.sin(tw/7) + 1)/2;\n    wanderer.position.set(-4.6 + 5.4*k, 0, -2.3 + .5*Math.sin(tw/3)); wanderer.rotation.y = Math.cos(tw/7) > 0 ? Math.PI/2 : -Math.PI/2;\n    bodies = [{x: wanderer.position.x, z: wanderer.position.z, h: 1.74}];\n    if (pos.y < 2.5) bodies.push({x: pos.x, z: pos.z, h: pos.y + .14}); }\n  drawUI(t); scrTex.needsUpdate = true;\n  drawWallShadow(t); wallTex.needsUpdate = true;\n  drawFloorUI(t); floorTex.needsUpdate = true;\n  renderer.render(scene, camera);\n  requestAnimationFrame(frame);\n}\nsetMode('evening');\nPromise.all([document.fonts.load('700 40px Inter'), document.fonts.load('40px Silkscreen'), document.fonts.load('40px \"Pixelify Sans\"'), document.fonts.load('600 40px \"Pixelify Sans\"')]).finally(() => {\n  document.getElementById('loading').remove();\n  requestAnimationFrame(frame);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"num": "V4", "name": "Light Network", "desc": "Dotted light paths link the screen to every projection. A new person's icon travels along them.", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Berkeley Looks Out · V4 Light Network<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{--blue:#002676;--deep:#001a52;--line:#3a5da8;--gold:#FDB515;--paper:#FAF6EC;--ink:#0b1b3f;--on2:#C9D3EA;--glow:#FDB515}\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%;background:#000;font-family:Inter,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;color:var(--paper);overflow:hidden}\n  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}\n  #c:active{cursor:grabbing}\n  .card{position:fixed;left:20px;top:20px;max-width:380px;background:rgba(0,38,118,.94);border:2px solid var(--line);border-radius:0;padding:16px 18px;box-shadow:0 6px 18px rgba(0,13,51,.25);backdrop-filter:blur(6px)}\n  .eyebrow{font-family:Silkscreen,monospace;font-size:12px;letter-spacing:.3em;color:var(--glow);margin:0 0 8px}\n  h1{font-family:'Pixelify Sans',sans-serif;font-size:21px;line-height:27px;margin:0 0 6px;font-weight:600;text-shadow:none}\n  .card p{font-size:13px;line-height:19px;color:var(--on2);margin:0}\n  .bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:calc(100% - 24px);background:rgba(0,38,118,.94);padding:10px;border:2px solid var(--line);backdrop-filter:blur(6px)}\n  .group{display:flex;gap:6px;align-items:center}\n  .sep{width:1px;height:28px;background:rgba(201,211,234,.35);margin:0 4px}\n  button{font:400 12px/1 Silkscreen,monospace;letter-spacing:.14em;color:var(--paper);background:transparent;border:2px solid rgba(201,211,234,.45);border-radius:0;padding:10px 12px;min-height:40px;cursor:pointer;white-space:nowrap}\n  button:hover{background:rgba(255,255,255,.16)}\n  button[aria-pressed=\"true\"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}\n  button.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}\n  button.primary:hover{background:#ffc94d}\n  .hint{position:fixed;right:20px;top:20px;font-size:12px;line-height:18px;color:var(--on2);background:rgba(0,26,82,.85);padding:8px 12px;border-radius:10px;text-align:right}\n  .note{position:fixed;right:20px;top:72px;max-width:260px;font-size:12px;line-height:18px;color:var(--ink);background:var(--gold);padding:8px 12px;display:none}\n  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--on2);background:var(--deep)}\n  @media (max-width:640px){.card{max-width:calc(100% - 40px)}.hint{display:none}.note{top:auto;bottom:150px;right:12px}}\n<\/style>\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js\"}}\n<\/script>\n<\/head>\n<body>\n<canvas id=\"c\" aria-label=\"Walkable 3D interior with projections\"><\/canvas>\n<div id=\"loading\">Loading…<\/div>\n\n<div class=\"card\">\n  <div class=\"eyebrow\">BERKELEY LOOKS OUT<\/div>\n  <h1>V4 · Light Network<\/h1>\n  <p>Dotted light paths link the screen to every projection. A new person's icon travels along them.<\/p>\n<\/div>\n\n<div class=\"hint\">Drag to look · WASD / arrows to walk<\/div>\n<div class=\"note\" id=\"note\">Daylight washes out projections. In airport tests, floor projections went almost unnoticed by day.<\/div>\n\n<div class=\"bar\" role=\"toolbar\" aria-label=\"Simulation controls\">\n  <div class=\"group\" role=\"group\" aria-label=\"Views\">\n    <button data-view=\"entry\" aria-pressed=\"true\">ENTRANCE<\/button>\n    <button data-view=\"near\">WALL<\/button>\n    <button data-view=\"screen\">SCREEN<\/button>\n    <button data-view=\"floor\">FLOOR<\/button>\n    <button data-view=\"hall\">CORRIDOR<\/button>\n    <button data-view=\"over\">OVERVIEW<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <div class=\"group\" role=\"group\" aria-label=\"Lighting\">\n    <button id=\"dayBtn\" aria-pressed=\"false\">DAY<\/button>\n    <button id=\"eveBtn\" aria-pressed=\"true\">NIGHT<\/button>\n  <\/div>\n  <div class=\"sep\" aria-hidden=\"true\"><\/div>\n  <button id=\"joinBtn\" class=\"primary\">SOMEONE JOINS<\/button>\n<\/div>\n\n<script type=\"module\">\nimport * as THREE from 'three';\n\nconst canvas = document.getElementById('c');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = THREE.PCFSoftShadowMap;\n\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color('#0b0f18');\nconst camera = new THREE.PerspectiveCamera(62, 1, 0.05, 80);\n\n// ---------- room: 14m x 10m x 4.5m ----------\nconst W = 14, D = 10, H = 4.5;\nconst xMin = -W/2, xMax = W/2, zMin = -D/2, zMax = D/2;\n\nfunction canvasTex(w, h, draw, repeat){\n  const c = document.createElement('canvas'); c.width = w; c.height = h;\n  draw(c.getContext('2d'), w, h);\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  t.anisotropy = 8;\n  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }\n  return t;\n}\nfunction rand(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }\n\n// polished concrete\nconst concreteTex = canvasTex(512, 512, (g, w, h) => {\n  g.fillStyle = '#8b8e90'; g.fillRect(0,0,w,h);\n  const r = rand(7);\n  for (let i=0;i<9000;i++){ const v = 110 + r()*60; g.fillStyle = `rgba(${v},${v+2},${v+4},${0.08+r()*0.1})`; g.fillRect(r()*w, r()*h, 1+r()*3, 1+r()*3); }\n  g.strokeStyle = 'rgba(60,62,66,.35)'; g.lineWidth = 2; g.strokeRect(0,0,w,h);\n}, [6, 4]);\nconst floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({map: concreteTex, roughness: .32, metalness: .08}));\nfloor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);\n\n// perforated plywood (Jacobs foyer signature)\nfunction plywoodTex(seed, clusters){\n  return canvasTex(1024, 1024, (g, w, h) => {\n    g.fillStyle = '#e8d9bd'; g.fillRect(0,0,w,h);\n    const r = rand(seed);\n    for (let i=0;i<40;i++){ g.fillStyle = `rgba(190,160,115,${0.05+r()*0.06})`; g.fillRect(0, r()*h, w, 2+r()*10); }\n    g.strokeStyle = 'rgba(150,120,80,.5)'; g.lineWidth = 3;\n    for (let x=0;x<=w;x+=256) { g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }\n    g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();\n    const sp = 22;\n    for (let y=sp/2;y<h;y+=sp) for (let x=sp/2;x<w;x+=sp){\n      let wgt = 0;\n      for (const [cx,cy,rr] of clusters){ const d = Math.hypot(x-cx, y-cy); wgt = Math.max(wgt, 1 - d/rr); }\n      if (wgt <= 0 || r() > wgt*1.6) continue;\n      g.fillStyle = '#d4682b'; g.beginPath(); g.arc(x, y, 3 + wgt*5, 0, Math.PI*2); g.fill();\n    }\n  });\n}\nconst wallPly = plywoodTex(11, [[260,300,260],[620,240,220],[520,700,280],[900,620,200]]);\nconst ceilPly = plywoodTex(23, [[200,200,500],[800,700,500],[500,500,300]]);\nceilPly.wrapS = ceilPly.wrapT = THREE.RepeatWrapping; ceilPly.repeat.set(3,2);\n\nconst white = new THREE.MeshStandardMaterial({color:'#e9ecee', roughness:.9});\nconst teal = new THREE.MeshStandardMaterial({color:'#8fb2b4', roughness:.85});\nfunction wall(w, h, mat, pos, rotY){\n  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);\n  m.position.set(...pos); m.rotation.y = rotY; m.receiveShadow = true; scene.add(m); return m;\n}\n// corridor opening on the right of the back wall\nconst CX0 = 4.8, CX1 = 7.0, CZ1 = zMin - 12, CH = 3.0, CXM = (CX0 + CX1)/2;\nwall(CX0 - xMin, H, white, [(xMin + CX0)/2, H/2, zMin], 0);                // back wall: projection surface\nwall(CX1 - CX0, H - CH, white, [CXM, (H + CH)/2, zMin], 0);                  // lintel over corridor\nwall(D, H, new THREE.MeshStandardMaterial({map: wallPly, roughness:.8}), [xMin, H/2, 0], Math.PI/2); // plywood wall\nwall(W, H, teal, [0, H/2, zMax], Math.PI);                                // front wall\nconst ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D),
